version: '3'

tasks:
  list:
    desc: "Print available tasks from this Taskfile"
    cmds:
      - task --list
  
  run:
    desc: "Run the application"
    cmds:
      - go run ./cmd

  build:
    desc: "Build the application"
    cmds:
      - go build -o main .

  test:
    desc: "Run all tests"
    cmds:
      - go test ./...

  install-tools:
    desc: "Install developer tools (golangci-lint) into $(go env GOPATH)/bin"
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.58.0

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  lint:
    desc: "Run golangci-lint (requires golangci-lint installed)"
    cmds:
      - golangci-lint run ./...
